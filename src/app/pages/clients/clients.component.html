<div class="clients-page">
    <div class="page-header">
      <h1 class="page-title">Clients</h1>
      <button class="btn-primary" (click)="openAddModal()">+ Ajouter un client</button>
    </div>
  
    <div class="search-bar">
      <input
        type="text"
        placeholder="Rechercher par nom, email, téléphone..."
        [(ngModel)]="searchTerm"
      />
    </div>
  
    <div class="panel">
      <table class="data-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Téléphone</th>
            <th>Email</th>
            <th>Adresse</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let client of filteredClients">
            <td>{{ client.nom }}</td>
            <td>{{ client.prenom }}</td>
            <td>{{ client.telephone }}</td>
            <td>{{ client.email }}</td>
            <td>{{ client.adresse }}</td>
            <td class="actions-cell">
              <button class="btn-icon" (click)="openEditModal(client)">✏️</button>
              <button class="btn-icon delete" (click)="deleteClient(client.id)">🗑️</button>
            </td>
          </tr>
          <tr *ngIf="filteredClients.length === 0">
            <td colspan="6" class="empty-row">Aucun client trouvé.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <!-- Modal Ajout / Modification -->
  <div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <h2>{{ isEditMode ? 'Modifier le client' : 'Ajouter un client' }}</h2>
  
      <div class="form-group">
        <label>Nom</label>
        <input type="text" [(ngModel)]="currentClient.nom" placeholder="Nom" />
      </div>
  
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" [(ngModel)]="currentClient.prenom" placeholder="Prénom" />
      </div>
  
      <div class="form-group">
        <label>Téléphone</label>
        <input type="text" [(ngModel)]="currentClient.telephone" placeholder="Téléphone" />
      </div>
  
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="currentClient.email" placeholder="Email" />
      </div>
  
      <div class="form-group">
        <label>Adresse</label>
        <input type="text" [(ngModel)]="currentClient.adresse" placeholder="Adresse" />
      </div>
  
      <div class="modal-actions">
        <button class="btn-secondary" (click)="closeModal()">Annuler</button>
        <button class="btn-primary" (click)="saveClient()">Enregistrer</button>
      </div>
    </div>
  </div>
